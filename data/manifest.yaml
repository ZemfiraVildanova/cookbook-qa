# Corpus manifest (SPEC 2.1). `scripts/ingest.py` builds data/corpus.json from exactly these
# pages; data/corpus.lock.json pins the revision of each page.
#
# Selection rationale (2026-10-11, from `scripts/ingest.py --list` over the categories below):
# - Six groups: soups, desserts, vegetarian/vegan dishes, pasta and noodles, and two national
#   cuisines (Italian, Indian) plus a small Mexican group. Pad Thai and Chow Mein cover noodles;
#   Edikang Ikong and Taco Soup widen the cuisine spread.
# - Same-dish pairs (16) make "recipes that disagree" testable: Pasta and Bean Soup, Tres Leches
#   Cake, Snickerdoodles, Banana Cream Pie, Macaroni and Cheese (three variants), Hummus,
#   Pancakes, Ratatouille, Shakshuka, Pesto, Risotto, Eggplant Parmesan, Focaccia, Baingan
#   Bartha, Tadka Dhal, Salsa.
# - Different levels of structure: Wikibooks search (`-hastemplate:"Recipe summary"`) finds only
#   two pages without the summary template among the categories used (Edikang Ikong, Shakshuka);
#   both are included. Focaccia I lists ingredients in a wikitable; Edikang Ikong uses
#   "Recipe"/"Preparation" headings; 23 pages declare no time (unknown time filters never pass).
# - Time coverage: 32 of 55 pages declare a parseable time, so time constraints have recall.
# - Diet coverage: well over 10 pages carry a Vegetarian or Vegan category.
# Categories listed with --list: "Soup recipes", "Dessert recipes", "Recipes using pasta and
# noodles", "Italian recipes", "Indian recipes", "Mexican recipes", "Vegetarian recipes",
# "Vegan recipes". The categories "Pasta recipes" and "Noodle recipes" are empty on Wikibooks.
source: https://en.wikibooks.org/w/api.php
license: CC BY-SA 4.0

