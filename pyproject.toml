[project]
name = "recipe-qa"
version = "0.1.0"
description = "Recipe Q&A service over a Wikibooks Cookbook corpus"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic>=2",
    "pydantic-settings>=2",
    "numpy",
    "rank-bm25",
    "httpx",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "mypy",
    "types-pyyaml>=6.0.12.20260906",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/recipe_qa"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts", "evals"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N", "W", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/recipe_qa"]
mypy_path = "src"
explicit_package_bases = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["rank_bm25"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -ra"
xfail_strict = true
