# Retrieval-quality queries for evals/retrieval_eval.py (SPEC 12.2, ADR-001).
# `expect` lists the recipe ids that count as a hit (any of them). Half are dish names,
# half are paraphrases that share few tokens with the title, so lexical and semantic
# retrieval are both exercised.
