name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * *" # daily production smoke (SPEC 11), 06:17 UTC
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Existing image tag to deploy (rollback). Empty: build and deploy this commit."
        required: false
        default: ""
      smoke_only:
        description: "Run only the production smoke (same as the daily schedule)."
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  packages: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_REPO: ghcr.io/zemfiravildanova/cookbook-qa
  # The public URL is read from the Northflank API at deploy time; the scheduled smoke has no
  # token, so it uses the repository variable or the known production URL.
  PUBLIC_URL: ${{ vars.PUBLIC_URL || 'https://p01--web--mm97qxgjjcql.code.run' }}

jobs:
  quality:
    name: lint, types, tests, secrets scan
    if: github.event_name != 'schedule' && inputs.smoke_only != true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
      - run: uv python install
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  frontend:
    name: frontend types, type-check, build
    if: github.event_name != 'schedule' && inputs.smoke_only != true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: uv python install
      - run: uv sync --frozen
      - name: Regenerate the OpenAPI document and the API types, fail on drift
        run: |
          uv run python scripts/export_openapi.py frontend/openapi.json
          cd frontend && npm ci --no-audit --no-fund && npm run -s types
          git diff --exit-code -- frontend/openapi.json frontend/src/api.d.ts
      - run: cd frontend && npm run -s typecheck
      - run: cd frontend && npm run -s build

  image:
    name: build image, eval gate, push
    if: >-
      github.event_name != 'pull_request' && github.event_name != 'schedule'
      && inputs.smoke_only != true && inputs.image_tag == ''
    needs: [quality, frontend]
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - id: meta
        run: echo "tag=${IMAGE_REPO}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
      - run: uv python install
      - run: uv sync --frozen --no-dev
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: ${{ steps.meta.outputs.tag }}
          build-args: GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Start the built image with the model keys
        env:
          TAG: ${{ steps.meta.outputs.tag }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          # -e NAME passes the variable from the environment; no key appears on a command line.
          docker run -d --rm -p 8000:8000 --name cq -e ANTHROPIC_API_KEY -e OPENAI_API_KEY "$TAG"
          for i in $(seq 1 30); do
            curl -fsS http://localhost:8000/health >/dev/null 2>&1 && break
            sleep 1
          done
          sha=$(curl -fsS http://localhost:8000/health | jq -r .git_sha)
          test "$sha" = "$GITHUB_SHA" || { echo "git_sha mismatch: $sha"; docker logs cq; exit 1; }
      - name: Eval gate, the full golden set against the container (SPEC 12.3)
        run: uv run python evals/run_evals.py --target http://localhost:8000 --runs 1 --label ci
      - name: Container log and report as artifacts
        if: always()
        run: |
          mkdir -p evals/reports
          docker logs cq > evals/reports/ci-container.log 2>&1 || true
          docker rm -f cq >/dev/null 2>&1 || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: eval-report-${{ github.sha }}
          path: |
            evals/reports/*-ci.json
            evals/reports/ci-container.log
          if-no-files-found: warn
          retention-days: 30
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: docker push "${{ steps.meta.outputs.tag }}"

  deploy:
    name: deploy to Northflank
    if: >-
      always() && github.event_name != 'pull_request' && github.event_name != 'schedule'
      && inputs.smoke_only != true && needs.quality.result == 'success'
      && (needs.image.result == 'success' || (needs.image.result == 'skipped' && inputs.image_tag != ''))
    needs: [quality, image]
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - name: Resolve image and expected SHA
        id: target
        env:
          INPUT_TAG: ${{ inputs.image_tag }}
          BUILT_TAG: ${{ needs.image.outputs.tag }}
        run: |
          if [ -n "$INPUT_TAG" ]; then
            echo "image=$INPUT_TAG" >> "$GITHUB_OUTPUT"
            echo "sha=${INPUT_TAG##*:}" >> "$GITHUB_OUTPUT"
          else
            echo "image=$BUILT_TAG" >> "$GITHUB_OUTPUT"
            echo "sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          fi
      - name: Create or update the template and run it, wait for the SHA in /health
        id: deploy
        env:
          IMAGE: ${{ steps.target.outputs.image }}
          GIT_SHA: ${{ steps.target.outputs.sha }}
          NORTHFLANK_API_TOKEN: ${{ secrets.NORTHFLANK_API_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: scripts/bootstrap.sh
      - name: Post-deploy smoke, three cases in production (SPEC 11)
        run: scripts/smoke.sh "${{ steps.deploy.outputs.url }}"
      - name: Summary
        run: echo "Deployed ${{ steps.target.outputs.image }} to ${{ steps.deploy.outputs.url }}" >> "$GITHUB_STEP_SUMMARY"

  smoke:
    name: scheduled production smoke
    if: github.event_name == 'schedule' || inputs.smoke_only == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: scripts/smoke.sh "$PUBLIC_URL"
