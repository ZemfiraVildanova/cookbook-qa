name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Existing image tag to deploy (rollback). Empty: build and deploy this commit."
        required: false
        default: ""

permissions:
  contents: read
  packages: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_REPO: ghcr.io/zemfiravildanova/cookbook-qa

jobs:
  quality:
    name: lint, types, tests, secrets scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
      - run: uv python install
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  image:
    name: build image, smoke it, push
    if: github.event_name != 'pull_request' && inputs.image_tag == ''
    needs: quality
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - id: meta
        run: echo "tag=${IMAGE_REPO}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: ${{ steps.meta.outputs.tag }}
          build-args: GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke the built image
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          docker run -d --rm -p 8000:8000 --name cq "$TAG"
          for i in $(seq 1 30); do
            curl -fsS http://localhost:8000/health >/dev/null 2>&1 && break
            sleep 1
          done
          sha=$(curl -fsS http://localhost:8000/health | jq -r .git_sha)
          test "$sha" = "$GITHUB_SHA" || { echo "git_sha mismatch: $sha"; docker logs cq; exit 1; }
          curl -fsS -X POST http://localhost:8000/ask -H 'content-type: application/json' \
            -d '{"question":"How do I make carbonara?"}' | jq -e '.refused != null and .meta.request_id != null'
          docker rm -f cq
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: docker push "${{ steps.meta.outputs.tag }}"

  deploy:
    name: deploy to Northflank
    if: >-
      always() && github.event_name != 'pull_request' && needs.quality.result == 'success'
      && (needs.image.result == 'success' || (needs.image.result == 'skipped' && inputs.image_tag != ''))
    needs: [quality, image]
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - name: Resolve image and expected SHA
        id: target
        env:
          INPUT_TAG: ${{ inputs.image_tag }}
          BUILT_TAG: ${{ needs.image.outputs.tag }}
        run: |
          if [ -n "$INPUT_TAG" ]; then
            echo "image=$INPUT_TAG" >> "$GITHUB_OUTPUT"
            echo "sha=${INPUT_TAG##*:}" >> "$GITHUB_OUTPUT"
          else
            echo "image=$BUILT_TAG" >> "$GITHUB_OUTPUT"
            echo "sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          fi
      - name: Create or update the template and run it
        id: deploy
        env:
          IMAGE: ${{ steps.target.outputs.image }}
          GIT_SHA: ${{ steps.target.outputs.sha }}
          NORTHFLANK_API_TOKEN: ${{ secrets.NORTHFLANK_API_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PUBLIC_URL: ${{ vars.PUBLIC_URL }}
        run: scripts/bootstrap.sh
      - name: Summary
        run: echo "Deployed ${{ steps.target.outputs.image }} to ${{ steps.deploy.outputs.url }}" >> "$GITHUB_STEP_SUMMARY"
